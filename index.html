const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b(P.salt), iterations:P.iter, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, key, b(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryUnlock(pw, remember){
  const html = await decrypt(pw);           // throws on wrong passphrase
  if(remember) sessionStorage.setItem("k142", pw);
  show(html);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try { await tryUnlock(document.getElementById("pw").value, true); }
  catch { err.textContent = "That’s not it. Try again."; }
});
// Auto-unlock within a session once the passphrase has been entered.
(async () => {
  const saved = sessionStorage.getItem("k142");
  if(saved){ try { await tryUnlock(saved, false); } catch { sessionStorage.removeItem("k142"); } }
})();
